<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rentloop-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentLoop | Secure Peer-to-Peer Item Rental Platform (Philippines)</title>
    <meta name="description" content="RentLoop is the Philippines' secure peer-to-peer item rental and trust platform, promoting accountability through verified government IDs and condition inspections." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* ── Splash Screen ───────────────────────────────────────── */
      * { box-sizing: border-box; margin: 0; padding: 0; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #060d1a;
        overflow: hidden;
        transition: opacity 0.7s cubic-bezier(0.4,0,0.2,1),
                    visibility 0.7s cubic-bezier(0.4,0,0.2,1);
      }
      #splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── Animated gradient mesh background ── */
      .splash-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .splash-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.18;
      }
      .splash-orb-1 {
        width: 500px; height: 500px;
        background: radial-gradient(circle, #14b8a6, transparent 70%);
        top: -150px; left: -150px;
        animation: orb-drift1 8s ease-in-out infinite alternate;
      }
      .splash-orb-2 {
        width: 400px; height: 400px;
        background: radial-gradient(circle, #6366f1, transparent 70%);
        bottom: -120px; right: -100px;
        animation: orb-drift2 10s ease-in-out infinite alternate;
      }
      .splash-orb-3 {
        width: 300px; height: 300px;
        background: radial-gradient(circle, #0ea5e9, transparent 70%);
        top: 50%; left: 60%;
        animation: orb-drift3 7s ease-in-out infinite alternate;
      }
      @keyframes orb-drift1 {
        from { transform: translate(0,0) scale(1); }
        to   { transform: translate(60px, 80px) scale(1.15); }
      }
      @keyframes orb-drift2 {
        from { transform: translate(0,0) scale(1); }
        to   { transform: translate(-50px,-60px) scale(1.2); }
      }
      @keyframes orb-drift3 {
        from { transform: translate(-50%,-50%) scale(1); }
        to   { transform: translate(-50%,-50%) scale(1.3) rotate(20deg); }
      }

      /* ── Grid overlay ── */
      .splash-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
      }

      /* ── Floating particles ── */
      .splash-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .particle {
        position: absolute;
        width: 3px; height: 3px;
        border-radius: 50%;
        background: #2dd4bf;
        opacity: 0;
        animation: particle-rise var(--dur, 4s) var(--delay, 0s) ease-in infinite;
      }
      @keyframes particle-rise {
        0%   { opacity: 0; transform: translateY(0) scale(0.5); }
        15%  { opacity: 0.7; }
        85%  { opacity: 0.3; }
        100% { opacity: 0; transform: translateY(-220px) scale(1.2); }
      }

      /* ── Main content card ── */
      .splash-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        z-index: 1;
      }

      /* ── Logo ring + glow ── */
      .splash-logo-wrap {
        position: relative;
        margin-bottom: 28px;
        animation: splash-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .splash-logo-ring {
        position: absolute;
        inset: -10px;
        border-radius: 28px;
        border: 1.5px solid rgba(45, 212, 191, 0.35);
        animation: ring-pulse 2s 0.8s ease-in-out infinite;
      }
      .splash-logo-ring-2 {
        position: absolute;
        inset: -20px;
        border-radius: 34px;
        border: 1px solid rgba(45, 212, 191, 0.15);
        animation: ring-pulse 2s 1.1s ease-in-out infinite;
      }
      .splash-logo-glow {
        position: absolute;
        inset: -24px;
        border-radius: 40px;
        background: radial-gradient(circle, rgba(20,184,166,0.3) 0%, transparent 70%);
        animation: glow-breathe 2.5s 0.5s ease-in-out infinite alternate;
      }
      .splash-logo {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 22px;
        display: block;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }
      @keyframes ring-pulse {
        0%, 100% { transform: scale(1);    opacity: 1; }
        50%       { transform: scale(1.06); opacity: 0.4; }
      }
      @keyframes glow-breathe {
        from { opacity: 0.6; transform: scale(0.9); }
        to   { opacity: 1;   transform: scale(1.1); }
      }

      /* ── Wordmark ── */
      .splash-wordmark {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 2.5rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.04em;
        line-height: 1;
        animation: splash-rise 0.6s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash-wordmark-teal { color: #2dd4bf; }

      /* ── Tagline ── */
      .splash-tagline {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        color: #475569;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-top: 8px;
        animation: splash-rise 0.6s 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* ── Trust badges ── */
      .splash-badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 32px;
        margin-bottom: 36px;
      }
      .splash-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 99px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.7rem;
        font-weight: 600;
        color: #94a3b8;
        opacity: 0;
        animation: badge-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .splash-badge:nth-child(1) { animation-delay: 0.6s; }
      .splash-badge:nth-child(2) { animation-delay: 0.75s; }
      .splash-badge:nth-child(3) { animation-delay: 0.9s; }
      .badge-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #2dd4bf;
        box-shadow: 0 0 6px #2dd4bf;
        flex-shrink: 0;
      }
      @keyframes badge-pop {
        from { opacity: 0; transform: translateY(10px) scale(0.9); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* ── Progress bar ── */
      .splash-progress-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        animation: splash-rise 0.5s 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash-bar-track {
        width: 220px;
        height: 3px;
        background: rgba(255,255,255,0.07);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar-fill {
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #0d9488, #2dd4bf, #67e8f9);
        background-size: 200% 100%;
        animation: bar-grow 1.6s 1s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                   bar-shimmer 1.5s 1s linear infinite;
        width: 0%;
      }
      .splash-loading-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.65rem;
        font-weight: 500;
        color: #334155;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        animation: loading-blink 1.4s 1.1s ease-in-out infinite;
      }
      @keyframes bar-grow {
        0%   { width: 0%; }
        30%  { width: 45%; }
        70%  { width: 72%; }
        100% { width: 100%; }
      }
      @keyframes bar-shimmer {
        0%   { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }
      @keyframes loading-blink {
        0%, 100% { opacity: 0.4; }
        50%       { opacity: 0.9; }
      }

      /* ── Bottom version pill ── */
      .splash-version {
        position: absolute;
        bottom: 28px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.65rem;
        font-weight: 500;
        color: #1e293b;
        letter-spacing: 0.06em;
        animation: splash-rise 0.5s 1.1s ease both;
      }

      /* ── Shared keyframes ── */
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.6) rotate(-6deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Plus_Jakarta_Sans',sans-serif]">

    <!-- Splash screen — dismissed by main.jsx once React mounts -->
    <div id="splash">

      <!-- Animated background layers -->
      <div class="splash-bg">
        <div class="splash-orb splash-orb-1"></div>
        <div class="splash-orb splash-orb-2"></div>
        <div class="splash-orb splash-orb-3"></div>
      </div>
      <div class="splash-grid"></div>

      <!-- Floating particles -->
      <div class="splash-particles" id="splash-particles"></div>

      <!-- Main content -->
      <div class="splash-card">

        <!-- Logo with ring + glow -->
        <div class="splash-logo-wrap">
          <div class="splash-logo-glow"></div>
          <div class="splash-logo-ring-2"></div>
          <div class="splash-logo-ring"></div>
          <img class="splash-logo" src="/rentloop-logo.png" alt="RentLoop" />
        </div>

        <!-- Wordmark + tagline -->
        <div class="splash-wordmark">Rent<span class="splash-wordmark-teal">Loop</span></div>

        <!-- Progress bar -->
        <div class="splash-progress-wrap">
          <div class="splash-bar-track">
            <div class="splash-bar-fill"></div>
          </div>
          <div class="splash-loading-text">Initializing platform…</div>
        </div>

      </div>

      <!-- Version pill -->
      <div class="splash-version">RentLoop &nbsp;·&nbsp; Secure Peer-to-Peer Trust</div>

    </div>

    <div id="root"></div>
    <script>
      // Generate floating particles for the splash screen
      (function() {
        var container = document.getElementById('splash-particles');
        if (!container) return;
        var colors = ['#2dd4bf','#67e8f9','#818cf8','#ffffff'];
        for (var i = 0; i < 22; i++) {
          var p = document.createElement('div');
          p.className = 'particle';
          p.style.cssText = [
            'left:' + (8 + Math.random() * 84) + '%',
            'bottom:' + (Math.random() * 30) + '%',
            '--dur:' + (3 + Math.random() * 5).toFixed(1) + 's',
            '--delay:' + (Math.random() * 4).toFixed(1) + 's',
            'width:' + (2 + Math.random() * 3).toFixed(0) + 'px',
            'height:' + (2 + Math.random() * 3).toFixed(0) + 'px',
            'background:' + colors[Math.floor(Math.random() * colors.length)],
            'opacity:0'
          ].join(';');
          container.appendChild(p);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
